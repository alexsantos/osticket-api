[project]
name = "osticket-api"
version = "0.12.1"
description = "A new API for OSTicket"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1,<0.164",
    "mysqlclient>=2.3.1,<3",
    "python-multipart>=0.0.34,<0.1",
    "requests>=2.34.2,<3",
    "sqlalchemy>=2.1.9,<2.2",
    "uvicorn>=0.54.0,<0.55",
    "python-dotenv>=1.2.4,<2",
    "httpx2>=2.16.2,<3",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = ["tests"]
addopts = "--cov=main --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0",
]
