name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read        # For checkout and comparing commits

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mysqlclient build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d

          # `mysqladmin ping` can succeed against the throwaway temp server the
          # MariaDB entrypoint boots to apply init scripts, before it restarts
          # into the real server - a window where connections get reset. Wait
          # for an actual authenticated query against the test DB/user instead,
          # so we know the real server (with the schema and grants applied) is up.
          echo "Waiting for MySQL to accept authenticated connections..."
          ready=false
          for i in $(seq 1 30); do
            if docker exec "$(docker ps -q -f name=osticket-test-db)" \
                mysql -h 127.0.0.1 -u testuser -ptestpassword osticket_test -e "SELECT 1" --silent >/dev/null 2>&1; then
              echo "MySQL is ready!"
              ready=true
              break
            fi
            echo "Still initializing... ($i/30)"
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "::error::MySQL did not become ready in time"
            exit 1
          fi

      - name: Run tests with coverage
        env:
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_HOST: 127.0.0.1
          DB_NAME: osticket_test
        run: |
          uv run pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true